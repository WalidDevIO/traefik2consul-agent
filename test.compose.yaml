# Test stack: a Traefik L2 instance + a whoami service to generate real rawdata.
# Usage: docker compose -f test.compose.yaml up -d
# Then add this instance in the dashboard: name=test, url=http://traefik:8080

services:
  traefik:
    image: traefik:latest
    container_name: traefik-test
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedByDefault=false"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=web,websecure"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"